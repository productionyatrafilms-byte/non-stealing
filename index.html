<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title"></title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <style>
    body {
      background-image: url("./assets/images/bg-img.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.8s ease;
    }

    main {
      position: relative;
      padding: 0 5vw;
      width: 100%;
      height: 50vw;
    }

    body.intro-active .home-button,
    body.intro-active .language-container,
    body.intro-active main {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    body.intro-done .home-button,
    body.intro-done .language-container,
    body.intro-done main {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    body.bg-change {
      background-image: url("./assets/images/bg-img-1.png");
    }

    .page-title {
      position: fixed;
      top: 2%;
      left: 50%;
      padding: 0.5vw 2vw;
      height: auto;
      text-align: center;
      z-index: 10000;
      border-radius: 0.5vw;
      background-color: #ffe137;
      transition:
        top 2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        left 2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        transform 2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-radius 1s ease;
      cursor: pointer;
    }

    body.intro-active .page-title {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(2);
    }

    body.intro-active .page-title:hover {
      border-radius: 30vw;
    }

    body.intro-done .page-title {
      top: 2%;
      left: 50%;
      transform: translateX(-50%) scale(1);
      cursor: default;
      pointer-events: none;
    }

    .page-title span {
      font-size: 3vw;
      text-align: center;
      color: #313131;
      font-family: "LondrinaSolid";
      display: block;
      font-weight: bolder !important;
    }

    body[data-lang="hi"] .page-title span {
      font-family: "ITFDevanagari";
    }

    body[data-lang="gu"] .page-title span {
      font-family: "NotoSansGujaratiRegular";
    }
  </style>

    <script src="./assets/js/app.js"></script>

    <script>
      const pageTitle = document.querySelector(".page-title");
      const introSound = new Audio("./assets/audio/transition/2.mp3");

      pageTitle.addEventListener("click", function () {
        if (document.body.classList.contains("intro-done")) return;

        introSound.currentTime = 0;
        introSound.play().catch(() => {});

        document.body.classList.add("intro-done");
        document.body.classList.add("bg-change");
        document.body.classList.remove("intro-active");
      });

      const subPointSound = new Audio("./assets/audio/pop.mp3");

      document.querySelectorAll(".col a").forEach(function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();

          subPointSound.currentTime = 0;
          subPointSound.play().catch(() => {});

          const col = link.closest(".col");
          const href = link.getAttribute("href");
          const thumb = col.querySelector(".thumb");

          if (col.dataset.animating === "true") return;
          col.dataset.animating = "true";

          col.classList.add("anim-front-down");

          setTimeout(function () {
            col.classList.remove("anim-front-down");

            col.classList.add("anim-swap");

            if (thumb) {
              thumb.style.animation = "none";
              thumb.style.opacity = "1";
            }

            setTimeout(function () {
              col.classList.remove("anim-swap");

              if (thumb) {
                thumb.style.opacity = "";
                thumb.style.animation = "";
              }

              col.classList.add("anim-up");

              setTimeout(function () {
                window.location.href = href;
              }, 1000);
            }, 500);
          }, 1000);
        });
      });
    </script>
